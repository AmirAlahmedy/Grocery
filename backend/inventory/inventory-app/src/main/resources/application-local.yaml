server:
  port: 8081

spring:
  application:
    name: inventory
  webflux:
    base-path: /inventory
  data:
    mongodb:
      host: inventory-mongo
      port: 27017
      database: inventory

mongo:
  host: localhost
  port: 27017
  database: inventory

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            add:
              type:
                headers: false
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            value:
              default:
                type: com.amir.inventory.domain.Order

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,mappings

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    org.mongodb: DEBUG
